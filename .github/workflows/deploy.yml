name: deploy

on:
  push:
    branches:
      - main
    paths:
      - values/hotaru-api.yaml
      - charts/hotaru-api/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-hotaru
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  CLUSTER_NAME: hotaru

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: hotaru-deploy-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if the cluster exists
        id: cluster
        run: |
          if status=$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.status --output text 2> "$RUNNER_TEMP/describe-cluster.err"); then
            if [ "$status" != "ACTIVE" ]; then
              echo "::error::Cluster $CLUSTER_NAME is $status"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ResourceNotFoundException "$RUNNER_TEMP/describe-cluster.err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/describe-cluster.err" >&2
            exit 1
          fi

      - name: Skip when the cluster does not exist
        if: steps.cluster.outputs.exists == 'false'
        run: echo "Cluster $CLUSTER_NAME does not exist. Skipped the deployment." >> "$GITHUB_STEP_SUMMARY"

      - name: Update kubeconfig
        if: steps.cluster.outputs.exists == 'true'
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --alias hotaru

      - name: Set up Helm and helmfile
        if: steps.cluster.outputs.exists == 'true'
        uses: ./.github/actions/setup-helmfile

      - name: Install helm-diff
        if: steps.cluster.outputs.exists == 'true'
        env:
          HELM_DIFF_VERSION: 3.15.13
          HELM_DIFF_KEY_FINGERPRINT: C5645EF47482257A1F806D2BEA17A2A206AFF8CD
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 0700 "$GNUPGHOME"
          curl -fsSLo "$RUNNER_TEMP/databus23.asc" https://github.com/databus23.gpg
          gpg --batch --import "$RUNNER_TEMP/databus23.asc"
          gpg --batch --list-keys "$HELM_DIFF_KEY_FINGERPRINT"
          gpg --batch --export "$HELM_DIFF_KEY_FINGERPRINT" > "$RUNNER_TEMP/helm-diff.gpg"
          helm plugin install "https://github.com/databus23/helm-diff/releases/download/v${HELM_DIFF_VERSION}/helm-diff-linux-amd64.tgz" --keyring "$RUNNER_TEMP/helm-diff.gpg"
          helm diff version
