name: Set up Helm and helmfile
description: Install pinned Helm and helmfile after verifying their SHA-256 checksums

runs:
  using: composite
  steps:
    - name: Install Helm
      shell: bash
      env:
        HELM_VERSION: v4.3.0
        HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      run: |
        curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
        echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
        sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
        helm version --short

