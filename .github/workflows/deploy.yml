name: deploy

on:
  push:
    branches:
      - main
    paths:
      - values/hotaru-api.yaml
      - charts/hotaru-api/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-hotaru
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  CLUSTER_NAME: hotaru

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: hotaru-deploy-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if the cluster exists
        id: cluster
        run: |
          if status=$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.status --output text 2> "$RUNNER_TEMP/describe-cluster.err"); then
            if [ "$status" != "ACTIVE" ]; then
              echo "::error::Cluster $CLUSTER_NAME is $status"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ResourceNotFoundException "$RUNNER_TEMP/describe-cluster.err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/describe-cluster.err" >&2
            exit 1
          fi

      - name: Skip when the cluster does not exist
        if: steps.cluster.outputs.exists == 'false'
        run: echo "Cluster $CLUSTER_NAME does not exist. Skipped the deployment." >> "$GITHUB_STEP_SUMMARY"

      - name: Update kubeconfig
        if: steps.cluster.outputs.exists == 'true'
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --alias hotaru

      - name: Set up Helm, helmfile and helm-diff
        if: steps.cluster.outputs.exists == 'true'
        uses: ./.github/actions/setup-helmfile
        with:
          helm-diff: true

      - name: Make sure kube-system is out of reach
        if: steps.cluster.outputs.exists == 'true'
        run: |
          answer=$(kubectl --context hotaru auth can-i create deployments --namespace kube-system || true)
          echo "create deployments in kube-system: $answer"
          if [[ "$answer" != no* ]]; then
            echo "::error::The deploy role must not create deployments in kube-system"
            exit 1
          fi

      - name: Deploy hotaru-api
        if: steps.cluster.outputs.exists == 'true'
        run: helmfile -l name=hotaru-api apply

      - name: Write the summary
        if: steps.cluster.outputs.exists == 'true'
        run: |
          image=$(kubectl --context hotaru --namespace hotaru get deployment hotaru-api -o jsonpath='{.spec.template.spec.containers[0].image}')
          {
            echo "Deployed hotaru-api with image tag ${image##*:}"
            echo
            echo '```'
            helm list --kube-context hotaru --namespace hotaru
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
