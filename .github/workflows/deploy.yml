name: deploy

on:
  push:
    branches:
      - main
    paths:
      - values/hotaru-api.yaml
      - charts/hotaru-api/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hotaru
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
